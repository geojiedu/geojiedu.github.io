@import url('https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800&display=swap');
:root{
  --bg:#F4F7FA; --surface:#FFFFFF; --surface2:#EEF3F7; --ink:#14223B; --muted:#55657C; --line:#D5DEE8;
  --navy:#1D3A6B; --navy-soft:#E6ECF6; --teal:#0E7A7E; --teal-soft:#DFF2F1; --on-navy:#FFFFFF;
  --amber:#8A5A00; --amber-bg:#FFF3D6; --amber-line:#E0A526;
  --violet:#5B3E96; --violet-bg:#EFEAF9;
  --ok:#156B47; --ok-bg:#E2F4EA; --red:#A23A24;
  --dry:#B5651D; --wet:#2B5EA8;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1726; --surface:#172238; --surface2:#1E2B44; --ink:#E6ECF5; --muted:#A5B2C6; --line:#2E3E5A;
    --navy:#8FB0E8; --navy-soft:#22335A; --teal:#5CC6C6; --teal-soft:#16393D; --on-navy:#0F1726;
    --amber:#FFD27A; --amber-bg:#3A2E10; --amber-line:#C8901C;
    --violet:#C6B0F2; --violet-bg:#2C2445; --ok:#7DD8A8; --ok-bg:#163A2A; --red:#F2A08A;
    --dry:#F0A35E; --wet:#8EB2F0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1726; --surface:#172238; --surface2:#1E2B44; --ink:#E6ECF5; --muted:#A5B2C6; --line:#2E3E5A;
  --navy:#8FB0E8; --navy-soft:#22335A; --teal:#5CC6C6; --teal-soft:#16393D; --on-navy:#0F1726;
  --amber:#FFD27A; --amber-bg:#3A2E10; --amber-line:#C8901C;
  --violet:#C6B0F2; --violet-bg:#2C2445; --ok:#7DD8A8; --ok-bg:#163A2A; --red:#F2A08A;
  --dry:#F0A35E; --wet:#8EB2F0;
  color-scheme:dark;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%; }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif; font-size:17px; line-height:1.65; word-break:keep-all; overflow-wrap:anywhere; }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--surface); }
button,input,textarea{ font:inherit; color:inherit; }
:focus-visible{ outline:3px solid var(--teal); outline-offset:2px; }
h1:focus,h2:focus{ outline:none; }
.wrap{ max-width:1120px; margin:0 auto; padding:0 18px; }
p{ max-width:70ch; }

.appbar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--surface); border-bottom:1px solid var(--line); }
.bar{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding-top:10px; }
.brand{ font-weight:800; font-size:.98rem; color:var(--navy); }
.role-pill{ border:1.5px solid var(--teal); color:var(--teal); background:var(--teal-soft); border-radius:999px; padding:4px 12px; font-size:.86rem; font-weight:700; cursor:pointer; min-height:36px; }
.steps{ list-style:none; margin:8px 0 0; padding:0; display:grid; grid-template-columns:repeat(6,1fr); gap:6px; }
.steps button{ width:100%; min-height:44px; display:flex; align-items:center; gap:8px; border:0; background:transparent; padding:4px 6px; cursor:pointer; border-radius:8px; text-align:left; font-size:.88rem; color:var(--muted); }
.steps button:disabled{ opacity:.45; cursor:not-allowed; }
.sn{ flex:none; width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font-weight:800; font-size:.82rem; border:1.5px solid var(--line); background:var(--surface); }
.steps button.past{ color:var(--ink); }
.steps button.past .sn{ background:var(--teal-soft); border-color:var(--teal); color:var(--teal); }
.steps button[aria-current="step"]{ background:var(--navy-soft); color:var(--ink); font-weight:700; }
.steps button[aria-current="step"] .sn{ background:var(--navy); border-color:var(--navy); color:var(--on-navy); }
.track{ height:4px; background:var(--surface2); margin-top:8px; }
.track > div{ height:100%; background:var(--teal); transition:width .3s; }
.remaining{ margin:0 auto; padding-top:6px; padding-bottom:8px; font-size:.86rem; color:var(--muted); max-width:1120px; }

.main{ padding-top:24px; padding-bottom:120px; }
.hero{ padding:8px 0 8px; }
.kicker{ margin:0 0 8px; font-size:.88rem; color:var(--teal); font-weight:700; }
h1{ font-size:clamp(1.9rem,4.2vw,2.8rem); line-height:1.2; margin:0; font-weight:800; letter-spacing:-.02em; color:var(--navy); }
.subtitle{ font-size:clamp(1.05rem,2vw,1.3rem); margin:10px 0 0; font-weight:500; }
.situation{ margin:20px 0 0; padding:18px 20px; background:var(--surface); border-left:5px solid var(--navy); border-radius:0 12px 12px 0; font-size:1.02rem; max-width:78ch; }
.sec-title{ font-size:1.25rem; margin:32px 0 14px; }
.page-title{ font-size:1.5rem; margin:0 0 6px; }
.lead{ margin:0 0 18px; color:var(--muted); }
.note{ font-size:.9rem; color:var(--muted); }
.start-row{ display:flex; justify-content:center; padding:20px 0 8px; }

.grid{ display:grid; gap:16px; }
.grid.three{ grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr)); }
.grid.two-col{ grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr)); }

.mcard{ background:var(--surface); border:1.5px solid var(--line); border-radius:14px; padding:18px; display:flex; flex-direction:column; gap:10px; }
.mcard.sample{ border-style:dashed; border-color:var(--amber-line); }
.mhead{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.mno{ font-size:.8rem; font-weight:800; color:var(--navy); background:var(--navy-soft); padding:2px 9px; border-radius:6px; }
.mcard h3{ margin:0; font-size:1.15rem; line-height:1.4; }
.points{ margin:0; padding-left:1.1em; font-size:.97rem; }
.points li{ margin:2px 0; }
.status{ display:inline-flex; align-items:center; gap:6px; font-size:.78rem; font-weight:700; padding:2px 10px 2px 4px; border-radius:999px; line-height:1.5; }
.st-i{ width:18px; height:18px; border-radius:50%; display:grid; place-items:center; font-size:.72rem; font-weight:800; }
.st-sample{ background:var(--amber-bg); color:var(--amber); border:1.5px dashed var(--amber-line); }
.st-sample .st-i{ background:var(--amber-line); color:#2A1B00; }
.st-concept{ background:var(--violet-bg); color:var(--violet); border:1px solid currentColor; }
.st-concept .st-i{ background:var(--violet); color:var(--surface); }
.st-verified{ background:var(--ok-bg); color:var(--ok); border:1px solid currentColor; }
.st-verified .st-i{ background:var(--ok); color:var(--surface); }
.source{ display:grid; grid-template-columns:auto 1fr; gap:6px 10px; align-items:center; margin-top:auto; padding-top:8px; border-top:1px solid var(--line); font-size:.86rem; }
.source label{ font-weight:700; color:var(--muted); }
.source input{ min-height:40px; border:1px solid var(--line); border-radius:8px; padding:6px 10px; background:var(--surface2); font-size:16px; width:100%; }
.nosrc{ grid-column:2; font-size:.78rem; color:var(--red); font-weight:700; }

.viz{ margin:0; background:var(--surface2); border-radius:10px; padding:12px; }
.viz-cap{ margin:0 0 8px; font-size:.84rem; color:var(--muted); display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.viz > .viz-cap:last-child{ margin:8px 0 0; }
.ex-tag{ font-size:.74rem; font-weight:800; color:var(--amber); background:var(--amber-bg); border:1.5px dashed var(--amber-line); border-radius:6px; padding:0 7px; }
.regions{ display:grid; gap:8px; grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr)); }
.region{ display:flex; gap:10px; align-items:center; background:var(--surface); border-radius:8px; padding:8px 10px; border-left:4px solid var(--wet); }
.region.dry{ border-left-color:var(--dry); }
.region.warm{ border-left-color:#C2402A; }
.map-tabs{ display:inline-grid; grid-auto-flow:column; gap:4px; padding:4px; border-radius:10px; background:var(--surface); border:1.5px solid var(--line); margin-bottom:10px; max-width:100%; }
.map-tabs button{ min-height:44px; padding:6px 14px; border:0; border-radius:8px; background:transparent; cursor:pointer; font-weight:700; font-size:.92rem; }
.map-tabs button.on{ background:var(--navy); color:var(--on-navy); }
.map-fig{ margin:0 0 8px; }
.map-fig img{ display:block; width:100%; height:auto; border-radius:8px; background:#fff; }
.map-fig .viz-cap{ margin:6px 0 0; }
.map-legend{ display:flex; flex-wrap:wrap; gap:4px 14px; margin:0 0 10px; font-size:.86rem; max-width:none; }
.map-legend b{ font-family:system-ui,sans-serif; }
.r-icon{ font-size:1.3rem; }
